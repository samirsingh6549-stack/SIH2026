name: ner_landslide_mobile
description: "AI-Based Landslide Early Warning & Ground Scout Mobile Application for North Eastern Region (SIH 2026)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management
  provider: ^6.1.2
  # Local SQLite database for zero-network offline outbox
  sqflite: ^2.3.0
  path: ^1.9.0
  # HTTP client for background gateway sync
  http: ^1.2.0
  # UUIDv4 for cryptographic idempotency keys
  uuid: ^4.3.3
  # Satellite GPS coordinates
  geolocator: ^11.0.0
  # Geospatial coordinate calculations
  latlong2: ^0.9.0
  # Audio siren playback
  audioplayers: ^5.2.1
  # UI and Icons
  cupertino_icons: ^1.0.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icons/
